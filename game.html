['吐司','麵包','麵包','Good','🔥'],['起司吐司','麵包','起司','Good','🧀'],['香蕉吐司','麵包','香蕉','Good','🍌'],['番茄吐司','麵包','番茄','Good','🍅'],['煎蛋吐司','麵包','雞蛋','Good','🍳'],['牛奶吐司','麵包','牛奶','Bad','🥛'],['起司義大利麵','義大利麵','起司','Good','🍝'],['番茄義大利麵','義大利麵','番茄','Good','🍅'],['蛋炒拉麵','拉麵','雞蛋','Good','🍜'],['香蕉起司麵','香蕉','起司','Bad','❓'],['咖啡','咖啡豆','牛奶','Good','☕'],['番茄牛奶','番茄','牛奶','Bad','❓'],['南瓜湯','南瓜','牛奶','Good','🥣'],['肉丸','肉','雞蛋','Good','🍖'],['大蒜米飯','大蒜','米','Good','🍚'],['起司南瓜','南瓜','起司','Good','🎃'],['蛋殼麵','蛋殼','義大利麵','Bad','❓'],['香蕉肉','香蕉','肉','Bad','❓']];

function addObj(name,x,y){const el=document.createElement('div');el.className='obj';el.innerHTML='<strong>'+iconFor(name)+'</strong><small>'+esc(name)+'</small>';el.style.left=x+'%';el.style.top=y+'%';$('scene').append(el);const o={id:++seq,name,el};objects.push(o);el.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();drag={o,x:e.clientX,y:e.clientY,t:performance.now(),vx:0,vy:0};el.classList.add('drag');el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!drag||drag.o!==o)return;const r=$('scene').getBoundingClientRect();drag.vx=e.clientX-drag.x;drag.vy=e.clientY-drag.y;el.style.left=Math.max(0,Math.min(90,(e.clientX-r.left)/r.width*100-4))+'%';el.style.top=Math.max(0,Math.min(85,(e.clientY-r.top)/r.height*100-5))+'%'});el.addEventListener('pointerup',()=>{if(!drag||drag.o!==o)return;const r=$('scene').getBoundingClientRect(),b=el.getBoundingClientRect(),cx=(b.left+b.width/2-r.left)/r.width,cy=(b.top+b.height/2-r.top)/r.height;el.classList.remove('drag');if(cx>.58&&cy>.70&&pot.length<(current==='rat'?2:3)&&['dorm','bistro','rat'].includes(current)){pot.push(name);say(name+' 放入料理設備');renderSlots();el.remove();objects=objects.filter(a=>a!==o)}else interact(name,cx,cy,Math.hypot(drag.vx,drag.vy));drag=null;save()});}
function interact(n,x,y,speed){
 if(n==='鑰匙'&&current==='dorm'&&data.keyFound){data.drawer=true;data.items['起司']=true;data.cheeseAvailable=true;say('鑰匙打開 Shane 的櫃子，取得起司。');}

  if(data.redCassettePlayed&&data.greenCassettePlayed){data.remix=true;data.items['Remix']=true;say('兩卷卡帶都已播放，混音帶 Remix 已出現。');}else say(n+' 已播放。');
 }
 else if(n==='Remix'&&current==='dorm'&&data.remix){data.remixPlayed=true;complete(2);say('Remix 播放完成！');}

 else if(current==='cafe'&&n==='警報器'&&data.fire){data.alarmHits=(data.alarmHits||0)+1;if(data.alarmHits<3)say('警報玻璃裂開：'+data.alarmHits+'/3。再敲幾次！');else{data.alarmGlassBroken=true;data.items['警報按鈕']=true;say('警報玻璃碎了，露出裡面的按鈕！');}}

data.itemStates=data.itemStates||{};function setItemState(item,state){data.itemStates[item]=state;save();log(item+' → '+state);}function itemState(item){return data.itemStates[item]||'原始';}function deviceAction(action){if((action==='power'||action==='empty')&&current!=='rat'){say('這項操作只適用於秘密老鼠關卡。');return}if(current==='rat'&&!data.powerUnlocked&&(action==='power'||action==='empty')){say('先輸入正確密碼解鎖罐頭鍋電源。');return}if(current==='rat'&&action==='empty'){data.ratSlots=data.ratSlots||{};data.ratSlots['bad-empty']=true;data.ratBad=Object.keys(data.ratSlots).filter(x=>x.startsWith('bad-')).length;say('空鍋測試完成：Bad '+data.ratBad+'/12。');if(data.ratGood>=9&&data.ratBad>=12)complete(5);save();return;}if(current==='rat'&&action==='power'){data.ratPower=data.ratPower==='high'?'low':'high';say('罐頭鍋目前為'+(data.ratPower==='high'?'高火力':'低火力')+'。');save();return;}if(current==='cafe'&&action==='toast'){data.paniniRuns=(data.paniniRuns||0)+1;if(data.paniniRuns===1)say('Panini 正在加熱。');else if(data.paniniRuns>=2){data.fire=true;data.items['警報器']=true;say('Panini 燒焦引發火災！快找到警報器並處理。');}return;}if(current==='dorm'&&action==='coffee'){if(data.dishesClean&&data.utensilsStored){data.coffeeBrewed=true;complete(3);say('咖啡沖煮完成！')}else say('先清潔餐具並把餐具收納好，咖啡機才會出現。')}else if(current==='dorm'&&action==='toast'){if(itemState('麵包')==='原始'){setItemState('麵包','烤吐司');say('麵包已烤成吐司。')}else if(itemState('麵包')==='烤吐司'){setItemState('麵包','焦黑吐司');say('吐司烤焦了！')}else say('吐司已經焦黑。')}else if(current==='dorm'&&action==='sponge'){if(data.faucet){setItemState('海綿','濕潤');data.watered=true;say('海綿吸水完成。')}else if(itemState('海綿')==='濕潤'){setItemState('海綿','乾燥');say('海綿已用於清潔。')}else say('先開水龍頭讓海綿吸水。')}else if(current==='bistro'&&action==='mixer'){if(!data.mixerPowered){say('先修復花盆旁的保險絲，再打開攪拌器開關。');return;}data.mixerRuns=(data.mixerRuns||0)+1;if(data.mixerRuns===1){setItemState('食材','研磨完成');say('攪拌器完成第一次研磨。')}else if(data.mixerRuns>=3){data.mess=true;data.scissorsFound=true;data.items['剪刀']=true;say('攪拌器失控，廚房弄得一團亂！空攪拌杯也掉出剪刀。')}else say('攪拌器再次運轉，聲音開始不對勁。')}else if(current==='bistro'&&action==='cloth'){if(data.mess){data.mess=false;setItemState('廚房','已清潔');complete(0);say('攪拌器造成的髒亂已清潔完成。')}else say('廚房目前還不需要清潔。')}else say('此設備在目前房間沒有可執行的動作。')};function renderSlots(){$('slots').innerHTML=pot.length?pot.map(n=>'<span class="chip">'+iconFor(n)+' '+esc(n)+'</span>').join(''):'<span class="muted">把食材拖到料理設備</span>'}
function complete(i){data.tasks[current]=data.tasks[current]||[];if(!data.tasks[current].includes(i)){data.tasks[current].push(i);say('待辦完成：'+rooms[current].tasks[i]);}if(current==='dorm'&&data.tasks.dorm.length===rooms.dorm.tasks.length&&!data.unlocked.includes('cafe')){data.unlocked.push('cafe');say('咖啡廳已解鎖！')}if(current==='cafe'&&data.tasks.cafe.length===rooms.cafe.tasks.length&&!data.unlocked.includes('bistro')){data.unlocked.push('bistro');say('小酒館已解鎖！')}if(current==='bistro'&&data.tasks.bistro.length===rooms.bistro.tasks.length&&!data.unlocked.includes('rat')){data.unlocked.push('rat');say('秘密老鼠關卡已解鎖！')}if(current==='rat'&&data.tasks.rat.length===rooms.rat.tasks.length&&!data.ending){data.ending=true;data.achievements.push('Little Chef');save();setTimeout(()=>modal('🎉 Little Chef · 完成！','<p>四條廚房解謎鏈都已完成。</p><p>你解鎖了所有關卡、整理了食譜本，也完成了秘密老鼠廚房。</p><p>這是本重建版的結局。你仍可繼續探索未確認的候選配方。</p>'),0)}save();renderTasks();renderNav();}

if(!pot.length){say('先把食材放進料理設備。');return}
const inputs=pot.map(canonical),limit=current==='rat'?2:3;

if(pot.length>limit){say('這台設備最多接受 '+limit+' 項材料。');return}

else if(legacy){const id=current+':'+legacy[0];if(!data.discovered.includes(id)){data.discovered.push(id);if(legacy[3]==='Good')data.coins++;say('新食譜發現：'+legacy[4]+' '+legacy[0]+'（'+legacy[3]+'）')}else say('你再次做出 '+legacy[0]+'。');}
else say(runtimeReady?'沒有符合目前食材狀態的候選配方。試試處理食材或換組合。':'配方資料載入中，請稍候。');
const bistroDishName=current==='bistro'&&(data.ratTrade||0)===1&&multiset(inputs,['番茄','起司'])?'Tomato Cheese Appetizer':null;
if(bistroDishName){const id='BIS-RAT-TRADE-001';if(!data.discovered.includes(id)){data.discovered.push(id);data.coins++;say('交易料理完成：'+bistroDishName+'（Good 候選，待實機核對）');}}

}

 if(stage>=1&&stage<=3&&((match&&match.name===tradeRecipes[stage-1])||bistroDishName===tradeRecipes[stage-1])){
  data.items[rewards[stage-1]]=true;data.ratTrade=stage+1;

 }

if(current==='rat'){

  {id:'low-cheese',power:'low',items:['起司']},{id:'low-double-cheese',power:'low',items:['起司','起司']},

 ];

}
