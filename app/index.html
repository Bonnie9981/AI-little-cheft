<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Chef 資料庫</title>
<style>
:root{color-scheme:light;--bg:#f7f5ef;--panel:#fff;--ink:#292821;--muted:#777365;--line:#e6e1d6;--accent:#5c7358}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}
header{padding:26px max(20px,calc((100vw - 1100px)/2));background:#e9eddf;border-bottom:1px solid var(--line)}
h1{margin:0 0 4px;font-size:26px}header p{margin:0;color:var(--muted)}
main{max-width:1100px;margin:24px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:13px}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:18px 0}.controls input,.controls select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}
.panel{padding:0;overflow:hidden}.bar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.bar small{color:var(--muted)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}th{font-size:13px;color:var(--muted);background:#fbfaf7}td{font-size:14px}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#f2eee2;font-size:12px}.muted{color:var(--muted)}footer{padding:18px;color:var(--muted);font-size:13px}
@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}th:nth-child(4),td:nth-child(4){display:none}}
</style></head><body>
<header><h1>Little Chef｜料理資料庫</h1><p>1.0 候選資料瀏覽器 · <a href="../prototype/">開啟廚房互動原型</a> · 未驗證配方不會被當成正確答案</p></header>
<main><section class="stats">
<div class="stat"><b>333</b><span>候選圖鑑總數</span></div><div class="stat"><b>211</b><span>Good 候選</span></div><div class="stat"><b>122</b><span>Bad 候選</span></div><div class="stat"><b>0</b><span>已實機驗證配方</span></div>
</section>
<div class="controls"><input id="q" placeholder="搜尋料理名稱／關鍵字"><select id="room"><option value="">全部場景</option><option>Student Dorm</option><option>Cafe Job</option><option>Bistro</option><option>Rat Level</option></select><select id="kind"><option value="">Good + Bad</option><option>Good</option><option>Bad</option></select></div>
<section class="panel"><div class="bar"><strong>候選料理清單</strong><small id="count">載入中</small></div><div style="overflow:auto"><table><thead><tr><th>料理名稱</th><th>場景</th><th>分類</th><th>候選配方／動作</th><th>來源與審核</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<footer>目前為資料層與查詢 UI 骨架。食譜清單由 machine-readable JSON 載入；配方輸入未完成前保持停用。資料來源與衝突請參閱 docs/RECIPE_INVENTORY.md 及 docs/RECIPE_CONFLICTS.md。</footer></main>
<script>
const tbody=document.getElementById('rows'),q=document.getElementById('q'),room=document.getElementById('room'),kind=document.getElementById('kind');let recipes=[];
async function init(){try{const r=await fetch('../data/recipes.candidates.json');if(!r.ok)throw Error(r.status);const db=await r.json();recipes=db.recipes;document.querySelector('.stats').innerHTML='<div class="stat"><b>'+recipes.length+'</b><span>候選圖鑑資料</span></div><div class="stat"><b>'+recipes.filter(x=>x.kind==='Good').length+'</b><span>Good 候選</span></div><div class="stat"><b>'+recipes.filter(x=>x.kind==='Bad').length+'</b><span>Bad 候選</span></div><div class="stat"><b>'+recipes.filter(x=>x.status==='VERIFIED_IN_GAME').length+'</b><span>實機驗證配方</span></div>';render()}catch(e){document.getElementById('count').textContent='資料載入失敗：請透過網站伺服器開啟 app/，不要直接以 file:// 開啟'}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const qv=q.value.trim().toLowerCase();const list=recipes.filter(x=>(!qv||x.name.toLowerCase().includes(qv)||(x.candidateFormula||'').toLowerCase().includes(qv)||(x.formulaCandidates||[]).some(v=>v.raw.toLowerCase().includes(qv)))&&(!room.value||x.room===room.value)&&(!kind.value||x.kind===kind.value));tbody.innerHTML=list.map(x=>{const formulas=(x.formulaCandidates||[]).map((v,i)=>(i+1)+'. '+v.raw).join(' / ')||x.candidateFormula||'尚無配方文字';const src=(x.sourceEvidence||[])[0];const source=src?'<a href="../'+esc(src.locator.split('#')[0])+'" target="_blank" rel="noopener">來源行 '+esc(src.locator.split('#L')[1]||'文件')+'</a>':'無公式來源';const review=x.normalization&&x.normalization.reviewRequired?'需人工核對':'文字格式簡單，仍未驗證';return '<tr><td><strong>'+esc(x.name)+'</strong></td><td>'+esc(x.room)+'</td><td><span class="pill">'+x.kind+'</span></td><td>'+esc(formulas)+'</td><td class="muted">'+source+'<br>'+review+'<br>'+esc(x.status)+'</td></tr>'}).join('');document.getElementById('count').textContent=list.length+' / '+recipes.length+' 筆'}[q,room,kind].forEach(x=>x.addEventListener('input',render));init();
</script></body></html>
